<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1733" width="2320" height="3466"><!-- svg-source:excalidraw --><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="0" y="0" width="1160" height="1733" fill="#ffffff"/><g transform="translate(10 10)"><text x="570.0" y="22.0" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#1e1e1e" text-anchor="middle" font-weight="bold" style="white-space: pre;">My job is still pending: why, and what to do</text><rect x="0" y="50" width="370" height="73.5" rx="16" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="185.0" y="83.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Run squeue --me and read the NODELIST(REASON)</text><text x="185.0" y="101.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">column of your pending job.</text><polygon points="165.0,186.5 330,266.5 165.0,346.5 0,266.5" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="253.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON is</text><text x="165.0" y="272.1" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Priority or</text><text x="165.0" y="290.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Resources?</text><rect x="400" y="173.5" width="740" height="186.0" rx="16" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="418.0" y="206.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">Your job is waiting its turn: the partition is busy, or jobs with higher priority are ahead of it.</text><text x="418.0" y="225.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• See how busy each partition is on the Slurm dashboards in S3DF Grafana.</text><text x="418.0" y="244.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Ask only for the CPUs, memory, GPUs and --time you need: smaller, shorter jobs fit into gaps</text><text x="418.0" y="262.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">   sooner.</text><text x="418.0" y="281.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• sprio shows your job&#x27;s priority. Big job arrays and over-sized requests use up your Repo&#x27;s</text><text x="418.0" y="300.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">   fairshare, so its later jobs start lower in the queue.</text><text x="418.0" y="319.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• If the job can be interrupted, --qos preemptable can also use idle nodes owned by other</text><text x="418.0" y="337.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">   Facilities.</text><line x1="330" y1="266.5" x2="400" y2="266.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="255.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><line x1="165.0" y1="123.5" x2="165.0" y2="186.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><polygon points="165.0,409.5 330,489.5 165.0,569.5 0,489.5" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="476.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON starts with</text><text x="165.0" y="495.1" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">AssocGrp</text><text x="165.0" y="513.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">(e.g. AssocGrpNodeLimit)?</text><polygon points="565.0,409.5 730,489.5 565.0,569.5 400,489.5" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="565.0" y="476.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Is your Facility over</text><text x="565.0" y="495.1" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">its Allocation on this</text><text x="565.0" y="513.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">cluster? (see Coact)</text><line x1="330" y1="489.5" x2="400" y2="489.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="478.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><rect x="790" y="424.625" width="350" height="129.8" rx="16" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="808.0" y="457.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">Normal jobs of all its Repos on this cluster</text><text x="808.0" y="476.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">are held until its usage drops.</text><text x="808.0" y="495.1" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Ask your Facility Czar to increase the</text><text x="808.0" y="513.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">   Allocation.</text><text x="808.0" y="532.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Meanwhile, use --qos preemptable.</text><line x1="730" y1="489.5" x2="790" y2="489.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="742.0" y="478.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><rect x="400" y="619.5" width="740" height="148.5" rx="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="418.0" y="652.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">Your Facility is already using its full node limit: all of its Repos share one limit for normal</text><text x="418.0" y="671.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">jobs.</text><text x="418.0" y="690.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Your job starts as the Facility&#x27;s running jobs finish.</text><text x="418.0" y="708.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Use --qos preemptable to run outside the limit.</text><text x="418.0" y="727.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• If this happens often, ask your Facility Czar to increase the Allocation or to change how it is</text><text x="418.0" y="746.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">   split between Repos.</text><line x1="565.0" y1="569.5" x2="565.0" y2="619.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="575.0" y="594.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><line x1="165.0" y1="346.5" x2="165.0" y2="409.5" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="369.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><polygon points="165.0,818.0 330,898.0 165.0,978.0 0,898.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="884.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON starts with</text><text x="165.0" y="903.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">QOS</text><text x="165.0" y="922.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">(e.g. QOSMaxJobs…)?</text><rect x="400" y="842.5" width="740" height="111.0" rx="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="418.0" y="875.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">You have reached a limit on how many jobs or resources one user or QoS can use at the same time.</text><text x="418.0" y="894.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Your other jobs start as your running ones finish.</text><text x="418.0" y="913.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Throttle job arrays: --array=1-1000%50 runs at most 50 tasks at once.</text><text x="418.0" y="931.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Bundle many short tasks into fewer, longer jobs.</text><line x1="330" y1="898.0" x2="400" y2="898.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="887.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><line x1="165.0" y1="569.5" x2="165.0" y2="818.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="592.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><polygon points="165.0,1028.0 330,1108.0 165.0,1188.0 0,1108.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="1094.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON is</text><text x="165.0" y="1113.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">ReqNodeNotAvail</text><text x="165.0" y="1132.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">or Reservation?</text><rect x="400" y="1052.5" width="740" height="111.0" rx="16" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="418.0" y="1085.5" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">The nodes your job needs are down or reserved, often for planned maintenance. A job whose --time</text><text x="418.0" y="1104.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">would run into a maintenance window waits until the window is over.</text><text x="418.0" y="1123.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Lower --time so the job can finish before the window, or wait.</text><text x="418.0" y="1141.8" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">• Check that --constraint or --gpus does not ask for nodes that are unavailable.</text><line x1="330" y1="1108.0" x2="400" y2="1108.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="1097.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><line x1="165.0" y1="978.0" x2="165.0" y2="1028.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="1001.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><polygon points="165.0,1238.0 330,1318.0 165.0,1398.0 0,1318.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="1304.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON is Dependency</text><text x="165.0" y="1323.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">or Dependency-</text><text x="165.0" y="1342.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">NeverSatisfied?</text><rect x="400" y="1271.875" width="740" height="92.2" rx="16" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="418.0" y="1304.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">Dependency: the job waits for the job named in --dependency and starts on its own.</text><text x="418.0" y="1323.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">DependencyNeverSatisfied: that job failed, so this one will never start. Cancel it with scancel</text><text x="418.0" y="1342.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">&lt;jobid&gt;, fix the first job and resubmit both.</text><line x1="330" y1="1318.0" x2="400" y2="1318.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="1307.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><line x1="165.0" y1="1188.0" x2="165.0" y2="1238.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="1211.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><polygon points="165.0,1448.0 330,1528.0 165.0,1608.0 0,1528.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2" stroke-linejoin="round"/><text x="165.0" y="1514.9" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">REASON is</text><text x="165.0" y="1533.6" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">JobHeldUser or</text><text x="165.0" y="1552.4" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">JobHeldAdmin?</text><rect x="400" y="1491.25" width="740" height="73.5" rx="16" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="418.0" y="1524.2" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">JobHeldUser: you (or your workflow tool) held the job. Release it with scontrol release &lt;jobid&gt;.</text><text x="418.0" y="1543.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;">JobHeldAdmin: an administrator held it. Contact s3df-help to find out why.</text><line x1="330" y1="1528.0" x2="400" y2="1528.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="344.0" y="1517.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">Yes</text><line x1="165.0" y1="1398.0" x2="165.0" y2="1448.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="1421.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text><rect x="0" y="1658.0" width="1140" height="54.8" rx="16" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="570.0" y="1691.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Any other reason: run scontrol show job &lt;jobid&gt; for details, then contact s3df-help@slac.stanford.edu or #comp-sdf with the job ID and the reason.</text><line x1="165.0" y1="1608.0" x2="165.0" y2="1658.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/><text x="175.0" y="1631.0" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="start" font-weight="bold" style="white-space: pre;">No</text></g></svg>
